[project]
name = "video-manager"
version = "0.1.0"
description = "Desktop app to build contact sheets for a video folder and triage what to keep or discard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felipe Dutra" }]
keywords = ["video", "thumbnails", "contact-sheet", "pyside6", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/FRubik/video-manager"
Issues = "https://github.com/FRubik/video-manager/issues"

[project.scripts]
video-manager = "video_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_manager"]
