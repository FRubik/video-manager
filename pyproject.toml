[project]
name = "video-manager"
version = "0.1.0"
description = "Interface gráfica para gerar contact sheets de vídeos e triar o que manter ou descartar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.scripts]
video-manager = "video_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_manager"]
